    <!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lobby - JDR</title>


    <style>

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #111;

            color: white;

        }


        .container {

            max-width: 750px;

            margin: 50px auto;

            padding: 20px;

        }


        h1 {

            text-align: center;

            font-size: 36px;

            margin-bottom: 30px;

        }


        .box {

            background: #1e1e1e;

            border: 1px solid #444;

            border-radius: 12px;

            padding: 25px;

            margin-bottom: 20px;

        }


        .code-label {

            text-align: center;

            color: #aaa;

        }


        .code {

            text-align: center;

            font-size: 34px;

            font-weight: bold;

            letter-spacing: 6px;

            margin: 12px 0 20px;

        }


        .mj {

            text-align: center;

            font-size: 20px;

        }


        .players-title {

            font-size: 24px;

            margin-bottom: 15px;

        }


        .player {

            display: flex;

            justify-content: space-between;

            align-items: center;

            background: #292929;

            border-radius: 8px;

            padding: 14px;

            margin: 10px 0;

        }


        .player-name {

            font-size: 18px;

        }


        .player-status {

            font-size: 14px;

        }


        .ready {

            color: #55dd77;

        }


        .not-ready {

            color: #ffb347;

        }


        button {

            border: none;

            border-radius: 8px;

            padding: 12px 18px;

            font-size: 16px;

            cursor: pointer;

            margin-top: 10px;

        }


        .ready-button {

            width: 100%;

            background: #444;

            color: white;

        }


        .ready-button:hover {

            background: #555;

        }


        .launch-button {

            width: 100%;

            background: #4caf50;

            color: white;

            font-size: 20px;

            font-weight: bold;

            padding: 16px;

        }


        .launch-button:hover {

            background: #5bc463;

        }


        .launch-button:disabled {

            background: #333;

            color: #777;

            cursor: not-allowed;

        }


        .waiting {

            color: #aaa;

            text-align: center;

            padding: 10px;

        }


        #status {

            text-align: center;

            color: #aaa;

            margin-top: 20px;

        }


        .error {

            color: #ff6666;

            text-align: center;

        }
        .character-area {
            display: none;
        }

        .character-title {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .character-selected {
            background: #292929;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 15px;
            text-align: center;
        }

        .character-selected strong {
            display: block;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .character-selected span {
            color: #aaa;
        }

        .characters-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .character-option {
            width: 100%;
            margin: 0;
            padding: 12px;
            text-align: left;
            background: #292929;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
        }

        .character-option:hover {
            background: #353535;
        }

        .character-option.selected {
            background: #3b3528;
            border-color: #a7864c;
        }

        .character-option-name {
            font-weight: bold;
            font-size: 16px;
        }

        .character-option-class {
            color: #aaa;
            font-size: 13px;
            margin-top: 3px;
        }

        .create-character-button {
            width: 100%;
            background: #4a2525;
            color: white;
            border: 1px solid #6d3737;
        }

        .create-character-button:hover {
            background: #5a2d2d;
        }
    </style>

</head>


<body>


<div class="container">


    <h1>🎲 Lobby de la partie</h1>


    <!-- Informations de la partie -->

    <div class="box">

        <div class="code-label">
            Code de la partie
        </div>


        <div id="partyCode"
             class="code">

            Chargement...

        </div>


        <div id="mjName"
             class="mj">

            Chargement du MJ...

        </div>

    </div>


    <!-- Liste des joueurs -->

    <div class="box">

        <div class="players-title">

            👥 Joueurs

        </div>

                <div id="playersList">

            <div class="waiting">
                Chargement des joueurs...
            </div>

        </div>


        <!-- =====================================================
             PERSONNAGE DU JOUEUR
        ====================================================== -->

        <div
            id="characterArea"
            class="character-area"
        >

            <div class="character-title">
                🧙 Mon personnage
            </div>


            <div
                id="selectedCharacter"
                class="character-selected"
            >
                <strong>Aucun personnage sélectionné</strong>
                <span>Choisis un personnage pour cette partie.</span>
            </div>


            <div
                id="charactersList"
                class="characters-list"
            >
                <div class="waiting">
                    Chargement des personnages...
                </div>
            </div>


            <button
                id="createCharacterButton"
                class="create-character-button"
                onclick="createCharacter()"
            >
                + Créer un personnage
            </button>

        </div>


        <!-- Bouton prêt pour le joueur -->

        <div id="playerReadyArea"></div>
    </div>


    <!-- Zone MJ -->

    <div id="mjArea"
         class="box"
         style="display:none;">

        <div class="players-title">
            👑 Maître du jeu
        </div>


        <button id="launchButton"
                class="launch-button"
                onclick="launchGame()">

            🚀 LANCER LA PARTIE

        </button>


        <div id="launchInfo"
             class="waiting">

            En attente des joueurs...

        </div>

    </div>


    <div id="status">
        ⏳ Connexion au lobby...
    </div>


</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script src="supabase.js"></script>


<script>


    // =====================================================
    // VARIABLES
    // =====================================================


    const partyCode =
        localStorage.getItem("jdr_party_code");


    const role =
        localStorage.getItem("jdr_role");


    const playerId =
        localStorage.getItem("jdr_player_id");


    let partyStarted = false;
    let selectedCharacterId = null;

// =====================================================
// PERSONNAGES DU JOUEUR
// =====================================================

async function loadMyCharacters() {

    if (role !== "joueur") {
        return;
    }


    const characterArea =
        document.getElementById("characterArea");

    const charactersList =
        document.getElementById("charactersList");


    characterArea.style.display = "block";


    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();


    if (userError || !user) {

        console.error(
            "Impossible de récupérer le joueur connecté :",
            userError
        );

        charactersList.innerHTML =
            '<div class="error">Impossible de récupérer ton identité.</div>';

        return;

    }


    const {
        data: characters,
        error
    } = await supabaseClient
        .from("characters")
        .select("id, name, class")
        .eq("player_id", user.id)
        .order("name");


    if (error) {

        console.error(
            "Erreur personnages :",
            error
        );

        charactersList.innerHTML =
            '<div class="error">Impossible de charger tes personnages.</div>';

        return;

    }


    renderMyCharacters(
        characters || []
    );

}

// =====================================================
// AFFICHER LES PERSONNAGES
// =====================================================

function renderMyCharacters(characters) {

    const list =
        document.getElementById("charactersList");

    const selectedBox =
        document.getElementById("selectedCharacter");


    list.innerHTML = "";


    if (characters.length === 0) {

        list.innerHTML =
            `
            <div class="waiting">
                Tu n'as aucun personnage enregistré.
            </div>
            `;

    } else {

        characters.forEach(character => {

            const button =
                document.createElement("button");

            button.className =
                "character-option";

            button.dataset.characterId =
                character.id;

            button.dataset.characterName =
                character.name ||
                "Personnage sans nom";

            button.dataset.characterClass =
                getClassDisplayName(
                    character.class
                );
            
            if (
                character.id ===
                selectedCharacterId
            ) {

                button.classList.add(
                    "selected"
                );

            }


            const name =
                document.createElement("div");

            name.className =
                "character-option-name";

            name.textContent =
                character.name ||
                "Personnage sans nom";


            const className =
                document.createElement("div");

            className.className =
                "character-option-class";

            className.textContent =
                getClassDisplayName(
                    character.class
                );


            button.appendChild(name);
            button.appendChild(className);


            button.onclick =
                () => {

                    selectCharacter(
                        character
                    );

                };


            list.appendChild(button);

        });

    }


    updateSelectedCharacterDisplay();
}

// =====================================================
// SELECTIONNER UN PERSONNAGE
// =====================================================

async function selectCharacter(character) {

    if (!playerId) {
        return;
    }

    const { error } =
        await supabaseClient
            .from("players")
            .update({
                character_id: character.id,
                ready: false
            })
            .eq("id", playerId);

    if (error) {

        console.error(
            "Erreur sélection personnage :",
            error
        );

        return;
    }

    selectedCharacterId =
        character.id;

    updateSelectedCharacterDisplay();

    await loadPlayers();

    await loadMyCharacters();

}

// =====================================================
// AFFICHER LE PERSONNAGE SELECTIONNE
// =====================================================

function updateSelectedCharacterDisplay() {

    const box =
        document.getElementById(
            "selectedCharacter"
        );


    if (!selectedCharacterId) {

        box.innerHTML =
            `
            <strong>Aucun personnage sélectionné</strong>
            <span>Choisis un personnage pour cette partie.</span>
            `;

        return;

    }


    const selectedButton =
        [...document.querySelectorAll(
            ".character-option"
        )]
        .find(button =>
            button.dataset.characterId ===
            selectedCharacterId
        );


    if (!selectedButton) {

        box.innerHTML =
            `
            <strong>Personnage sélectionné</strong>
            <span>Chargement...</span>
            `;

        return;

    }


    const characterName =
        selectedButton.dataset.characterName;

    const characterClass =
        selectedButton.dataset.characterClass;


    box.innerHTML =
        `
        <strong>${characterName}</strong>
        <span>${characterClass}</span>
        `;

}

    function getClassDisplayName(value) {

    const names = {

        eclaireur: "Éclaireur",
        technicien: "Technicien",
        ingenieur: "Ingénieur",
        medecin: "Médecin",
        tireur: "Tireur",
        combattant: "Combattant",
        scientifique: "Scientifique",
        diplomate: "Diplomate",
        commandant: "Commandant"

    };


    return names[value] || "Classe non définie";
}
    
    // =====================================================
    // CHARGER LA PARTIE
    // =====================================================


    async function loadParty() {


        if (!partyCode) {

            document.getElementById("status").textContent =
                "Aucune partie trouvée.";

            return;

        }


        const { data, error } =
            await supabaseClient

                .from("parties")

                .select("code, mj_name, started")

                .eq("code", partyCode)

                .single();


        if (error) {

            console.error(
                "Erreur partie :",
                error
            );

            document.getElementById("status").textContent =
                "Impossible de charger la partie.";

            return;

        }


        document.getElementById("partyCode").textContent =
            data.code;


        document.getElementById("mjName").textContent =
            "MJ : " + data.mj_name;


        partyStarted =
            data.started;


        // Si la partie est déjà lancée

        if (partyStarted) {

            goToGame();

            return;

        }


        document.getElementById("status").textContent =
            "⏳ En attente du lancement de la partie...";


        // Afficher la zone MJ

        if (role === "mj") {

            document.getElementById("mjArea").style.display =
                "block";

        }


        // Charger les joueurs

        await loadPlayers();


        if (role === "joueur") {

            await loadMyCharacters();

        }

     }

    // =====================================================
    // CHARGER LES JOUEURS
    // =====================================================


    async function loadPlayers() {


        const playersList =
            document.getElementById("playersList");


        const { data, error } =
            await supabaseClient

                .from("players")

                .select("id, name, character_name, character_id, connected, ready")

                .eq("party_code", partyCode)

                .eq("connected", true)

                .order("name");


        if (error) {

            console.error(
                "Erreur joueurs :",
                error
            );

            playersList.innerHTML =
                '<div class="error">Impossible de charger les joueurs.</div>';

            return;

        }


        // Aucun joueur

        if (!data || data.length === 0) {

            playersList.innerHTML =
                '<div class="waiting">Aucun joueur connecté pour le moment.</div>';

            updateLaunchButton([]);

            return;

        }


        // Affichage

        playersList.innerHTML = "";


        const me =
            data.find(
                player => player.id === playerId
            );

        if (me) {

            selectedCharacterId =
                me.character_id || null;

        }


        data.forEach(player => {


            const div =
                document.createElement("div");


            div.className =
                "player";


            const left =
                document.createElement("div");


            left.className =
                "player-name";


            left.textContent =
                "🟢 " + player.name;


            const right =
                document.createElement("div");


            right.className =
                "player-status";


            if (player.ready) {

                right.textContent =
                    "✓ PRÊT";

                right.classList.add("ready");

            } else {

                right.textContent =
                    "⏳ Pas prêt";

                right.classList.add("not-ready");

            }


            div.appendChild(left);

            div.appendChild(right);

            playersList.appendChild(div);

        });


        // Zone du bouton "Prêt"

        updatePlayerReadyButton(data);


        // Zone de lancement MJ

        updateLaunchButton(data);

    }


    // =====================================================
    // BOUTON PRÊT DU JOUEUR
    // =====================================================


    function updatePlayerReadyButton(players) {


        const area =
            document.getElementById("playerReadyArea");


        area.innerHTML = "";


        // Le MJ n'a pas besoin de ce bouton

        if (role === "mj") {

            return;

        }


        const me =
            players.find(
                player => player.id === playerId
            );


        if (!me) {

            return;

        }

        if (!me.character_id) {

            const message =
                document.createElement("div");

            message.className =
                "waiting";

            message.textContent =
                "⚠️ Sélectionne un personnage avant de te déclarer prêt.";

            area.appendChild(message);

            return;

        }
        
        const button =
            document.createElement("button");


        button.className =
            "ready-button";


        if (me.ready) {

            button.textContent =
                "✓ Je suis prêt";

        } else {

            button.textContent =
                "Je suis prêt";

        }


        button.onclick =
            toggleReady;


        area.appendChild(button);

    }


    // =====================================================
    // CHANGER L'ÉTAT PRÊT
    // =====================================================


    async function toggleReady() {


        if (!playerId) {

            return;

        }


        const { data: player, error: getError } =
            await supabaseClient

                .from("players")

                .select("ready")

                .eq("id", playerId)

                .single();


        if (getError || !player) {

            console.error(
                "Erreur joueur :",
                getError
            );

            return;

        }


        const { error } =
            await supabaseClient

                .from("players")

                .update({

                    ready: !player.ready

                })

                .eq("id", playerId);


        if (error) {

            console.error(
                "Erreur ready :",
                error
            );

            return;

        }


        await loadPlayers();

    }


    // =====================================================
    // VERIFIER SI TOUT LE MONDE EST PRÊT
    // =====================================================


    function updateLaunchButton(players) {


        if (role !== "mj") {

            return;

        }


        const button =
            document.getElementById("launchButton");


        const info =
            document.getElementById("launchInfo");


        if (!players.length) {

            button.disabled =
                true;

            info.textContent =
                "Aucun joueur dans la partie.";

            return;

        }


        const everyoneReady =
            players.every(
                player => player.ready === true
            );


        if (everyoneReady) {

            button.disabled =
                false;

            info.textContent =
                "✓ Tous les joueurs sont prêts !";

        } else {

            button.disabled =
                true;

            const notReady =
                players.filter(
                    player => !player.ready
                ).length;


            info.textContent =
                "⏳ " +
                notReady +
                " joueur(s) pas encore prêt(s).";

        }

    }


    // =====================================================
    // LANCER LA PARTIE
    // =====================================================


    async function launchGame() {


        if (role !== "mj") {

            return;

        }


        const { data: players, error: playersError } =
            await supabaseClient

                .from("players")

                .select("id, ready")

                .eq("party_code", partyCode)

                .eq("connected", true);


        if (playersError) {

            console.error(
                playersError
            );

            return;

        }


        if (!players.length) {

            alert(
                "Il faut au moins un joueur pour lancer la partie."
            );

            return;

        }


        const everyoneReady =
            players.every(
                player => player.ready === true
            );


        if (!everyoneReady) {

            alert(
                "Tous les joueurs doivent être prêts."
            );

            return;

        }


        // Passer la partie à "commencée"

        const { error } =
            await supabaseClient

                .from("parties")

                .update({

                    started: true

                })

                .eq("code", partyCode);


        if (error) {

            console.error(
                "Erreur lancement :",
                error
            );

            alert(
                "Impossible de lancer la partie."
            );

            return;

        }


        // Aller vers l'interface MJ

        window.location.href =
            "mj.html";

    }

    function createCharacter() {

    window.location.href =
        "créationperso.html";

    }

    // =====================================================
    // ALLER VERS LE JEU
    // =====================================================


    function goToGame() {


        if (role === "mj") {

            window.location.href =
                "mj.html";

        } else {

            window.location.href =
                "joueur.html";

        }

    }


    // =====================================================
    // ACTUALISATION AUTOMATIQUE
    // =====================================================


    loadParty();


    setInterval(() => {

        loadParty();

    }, 2000);


</script>


</body>

</html>
